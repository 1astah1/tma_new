services:
  postgres:
    image: postgres:15-alpine
    container_name: tma_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tma_shop
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - tma_network

  backend:
    build:
      context: ./tma-backend
      dockerfile: Dockerfile
    container_name: tma_backend
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tma_shop?sslmode=disable
      - JWT_SECRET=super-secret-key-min-32-chars-long!!
      - ACCOUNT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
      - ENVIRONMENT=production
      - UPLOAD_DIR=/app/uploads
      - TMA_URL=http://localhost
      - ADMIN_PANEL_URL=http://localhost:8081
    ports:
      - "8080:8080"
    volumes:
      - ./tma-backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tma_network

  frontend:
    build:
      context: ./tma-frontend
      dockerfile: Dockerfile
    container_name: tma_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tma_network

  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tma_admin
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - tma_network

  db-backup:
    build:
      context: ./db-backup
      dockerfile: Dockerfile
    container_name: tma_db_backup
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tma_shop?sslmode=disable
      - BACKUP_INTERVAL=21600
      - RETENTION_DAYS=7
    volumes:
      - backup_data:/backups
    depends_on:
      - postgres
    networks:
      - tma_network

  prometheus:
    image: prom/prometheus:latest
    container_name: tma_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - tma_network

  grafana:
    image: grafana/grafana:latest
    container_name: tma_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - tma_network

volumes:
  pg_data:
  backup_data:
  prometheus_data:
  grafana_data:

networks:
  tma_network:
    driver: bridge
