<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        var hash = window.location.hash || '';
        if (hash.indexOf('#/') === 0) {
          history.replaceState(null, '', hash.slice(1) || '/');
        } else if (hash && hash !== '#') {
          history.replaceState(null, '', '/');
        }
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          tg.ready();
          tg.expand();
        }
      })();
    </script>
    <title>COIN MINT</title>
    <script>
    // Браузер мог сохранить index.html прошлой сборки — он ссылается на файл,
    // которого на сервере уже нет: скрипт не грузится, экран остаётся белым.
    // Ловим это и один раз перезагружаемся мимо кэша.
    (function () {
      var KEY = 'bundle-reload-at';
      window.addEventListener('error', function (event) {
        var el = event.target;
        if (!el || el.tagName !== 'SCRIPT' || !el.src || el.src.indexOf('/assets/') === -1) return;
        if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 30000) return;
        sessionStorage.setItem(KEY, String(Date.now()));
        location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      }, true);
    })();
  </script>
</head>
  <body class="bg-tg-bg text-tg-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
